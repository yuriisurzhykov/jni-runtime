name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  host-tests:
    name: host tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: plain
            flags: ""
            filter: ".*"
          # LeakSanitizer is off: it reports allocations inside the JVM that the tests start.
          - name: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
            filter: ".*"
          # ThreadSanitizer covers the lock-based parts (roadmap P6.1, P7.1).
          - name: tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer"
            filter: "PeerTable|ListenerSet"
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Check that support/ does not include jni.h
        run: |
          if grep -rn "jni.h" support; then
            echo "support/ must not depend on jni.h" >&2
            exit 1
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
          -DCMAKE_SHARED_LINKER_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure -j4 -R "${{ matrix.filter }}"

  # The Android build of the runtime, and the release rules for the resulting .so (roadmap P8, tools/check-native-lib.sh).
  android-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build libjnirt_sample.so with the NDK
        run: |
          NDK="$ANDROID_NDK_LATEST_HOME"
          echo "NDK_BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          cmake -S ci/android-lib -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-android

      - name: Check the library
        run: |
          READELF="$NDK_BIN/llvm-readelf" NM="$NDK_BIN/llvm-nm" \
            tools/check-native-lib.sh --require-symbols build-android/libjnirt_sample.so

      # Keep the unstripped file: a tombstone from this build is symbolicated against it.
      - uses: actions/upload-artifact@v4
        with:
          name: libjnirt_sample-arm64-v8a-unstripped
          path: build-android/libjnirt_sample.so
